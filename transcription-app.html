# Output Destination & Formatting
## Where to Create the Output
- Create a new Notion page under Longer Form Thoughts (page ID: 2bf08da9fc3180dd9278d72224a93644)
- Page title format: M-DD-YY [Topic] Notes (e.g., "1-13-26 Jenny Wan Talk Notes")
## Page Structure
### Top of Page
Start with a gray callout block:
> Initial file generated by Claude on [today's date as mention].
### Section Format
- Use toggle headers for each section so content can be collapsed
- Section content for sections 1-3 should be nested/indented under the toggle
- Section content for section 4 will not have toggle header, and will simply be formatted as an H2.
- Use horizontal rules (---) between sections
### Section Headers
- ## 1. Full Notes
- ## 2. All Action Items & Themes
- ## 3. Synthesis
- ## 4. Action Items
### Section Labels
- Section 2 should start with: [Claude's Medium Processing]
- Section 3 should start with: [Claude's Full Processing]

# Output Structure
When given a transcript, produce three sections at different levels of processing:

## Section 1: Full Notes
Purpose: Preserve the original content with minimal interpretation.
Note: Do NOT include a cleaned transcript. Only include the bullet-pointed summary.
### Bullet-Pointed Summary
- Detailed, comprehensive bullets
- Low synthesis — stay close to what was actually said
- Capture all topics covered, in roughly the order they came up
- Include minor points, not just major ones
- Use nested bullets for sub-topics and related points
- Bold key topic labels (e.g., Connection to Circular Directory project:)

## Section 2: All Action Items & Themes
Purpose: Extract actionable and notable content without heavy interpretation.
### Action Items
- Any tasks, to-dos, or intentions mentioned
- Include vague ones ("I should probably..." counts)
- Note if urgency or timeline was mentioned
- Format: Bold the action item category, then description
### Key Themes & Takeaways
- What topics or ideas kept coming up?
- What seemed important to the speaker?
- Be thorough — capture as many as can be reasonably identified
- Format: Bold the theme name, then explanation

## Section 3: Synthesis
Purpose: High-level synthesis and interpretation.
### Key Themes & Takeaways
- Distilled, prioritized insights (numbered list)
- What matters most from this braindump?
- Format: Bold the theme, then full explanation in same paragraph
### Action Items
- Consolidated and clarified
- Grouped by category (e.g., Circular Directory:, Personal/Professional:)
- Include an Open question: section for unresolved questions
### Claude-Suggested Strategic Considerations
- Claude to suggest possible perspectives or framing on any challenges
- Claude to suggest possible business considerations on any challenges
- Notes for Claude: Okay to leave blank if none or if not applicable to topic or notes
### Quotes Worth Saving
- Particularly clear, insightful, or memorable phrasing
- Things that capture an idea well or might be useful to reference later
- Format as bullet list with quotes in quotation marks
- Keep these to be under 8 quotes
### Sentiment & Dynamics
- Overall tone: Two-line summary
- Unresolved: Bulleted list
- Settled: Bulleted list
### Decisions Made
- Any conclusions reached, even tentative ones
- "I'm going to..." or "I've decided..." statements
- Note if decisions felt firm or still open in parentheses
- Format: Bold the decision, then firmness note in parentheses

## Section 4: Action Items
Leave this section blank, Nayeli will fill it out after

# General Notes for Claude
- Default to being thorough rather than brief
- When in doubt about whether to include something, include it
- Maintain Nayeli's voice — don't over-formalize
- The three sections should be able to stand alone (some repetition is okay)
- Use "Nayeli" (not "Naye") in the synthesis section for clarity
- In Section 1, use "My" for Nayeli's reactions (e.g., "My reaction:") to preserve first-person voice

# Corrections & Substitutions
- Gantry -> Gantri: Always correct "Gantry" to "Gantri" (the company name)`;

    // ============================================================
    // HELPERS
    // ============================================================

    async function checkServer() {
      try {
        const r = await fetch(`${SERVER_URL}/health`, { signal: AbortSignal.timeout(2000) });
        return r.ok;
      } catch { return false; }
    }

    function loadTranscriptions() {
      try { return JSON.parse(localStorage.getItem("transcriptions") || "[]"); } catch { return []; }
    }
    function saveTranscriptions(list) {
      try { localStorage.setItem("transcriptions", JSON.stringify(list)); } catch {}
    }
    function getApiKey() { return localStorage.getItem("anthropic_api_key") || ""; }
    function setApiKeyStore(key) { localStorage.setItem("anthropic_api_key", key); }

    // ============================================================
    // COMPONENTS
    // ============================================================

    function ServerStatus({ online }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "6px 12px", fontSize: 11, letterSpacing: "0.03em", color: online ? "#3a7d5c" : "#a85c3a", background: online ? "#e8f5ee" : "#fdf0e6", borderRadius: 6, fontFamily: "'IBM Plex Mono', monospace", margin: "0 16px 8px" }}>
          <span style={{ width: 7, height: 7, borderRadius: "50%", background: online ? "#2ecc71" : "#e67e22", boxShadow: online ? "0 0 6px #2ecc7188" : "0 0 6px #e67e2288" }} />
          {online ? "Server connected" : "Server offline"}
        </div>
      );
    }

    function DeleteConfirmModal({ name, onConfirm, onCancel }) {
      return (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.35)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000 }} onClick={onCancel}>
          <div style={{ background: "#fff", borderRadius: 12, padding: "28px 28px 24px", width: 320, boxShadow: "0 8px 40px rgba(0,0,0,0.18)", animation: "fadeIn 0.15s ease" }} onClick={e => e.stopPropagation()}>
            <h3 style={{ fontSize: 16, fontWeight: 600, color: "#1a1a1a", marginBottom: 8 }}>Delete transcription?</h3>
            <p style={{ fontSize: 13, color: "#666", lineHeight: 1.5, marginBottom: 24 }}>
              <strong style={{ color: "#1a1a1a" }}>{name || "Untitled"}</strong> will be permanently deleted.
            </p>
            <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
              <button onClick={onCancel} style={{ padding: "8px 18px", border: "1.5px solid #ddd", borderRadius: 7, background: "#fff", fontSize: 13, fontWeight: 500, cursor: "pointer", fontFamily: "'IBM Plex Sans', sans-serif", color: "#555" }}>Cancel</button>
              <button onClick={onConfirm} style={{ padding: "8px 18px", border: "none", borderRadius: 7, background: "#e03d3d", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "'IBM Plex Sans', sans-serif", color: "#fff" }}>Delete</button>
            </div>
          </div>
        </div>
      );
    }

    function Sidebar({ transcriptions, activeId, onSelect, onCreate, serverOnline, onSettings, onDelete }) {
      const [menuOpenId, setMenuOpenId] = useState(null);
      const [confirmId, setConfirmId] = useState(null);
      const menuRef = useRef(null);

      useEffect(() => {
        function handleClickOutside(e) {
          if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpenId(null);
        }
        if (menuOpenId) document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, [menuOpenId]);

      function handleDeleteConfirm() {
        onDelete(confirmId);
        setConfirmId(null);
        setMenuOpenId(null);
      }

      const confirmTarget = transcriptions.find(t => t.id === confirmId);

      return (
        <div style={{ width: 272, minWidth: 272, borderRight: "1px solid #e2e2e2", display: "flex", flexDirection: "column", background: "#fafafa" }}>
          <div style={{ padding: "20px 16px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid #ececec" }}>
            <span style={{ fontSize: 15, fontWeight: 600, letterSpacing: "-0.01em", color: "#1a1a1a" }}>Transcriptions</span>
            <button onClick={onCreate} className="btn-new"><span style={{ fontSize: 15, lineHeight: 1 }}>+</span> New</button>
          </div>
          <ServerStatus online={serverOnline} />
          <div style={{ flex: 1, overflowY: "auto", padding: "4px 0" }}>
            {transcriptions.length === 0 && (
              <p style={{ color: "#999", fontSize: 13, textAlign: "center", marginTop: 40, lineHeight: 1.5, padding: "0 20px" }}>No transcriptions yet.<br />Click <strong>+ New</strong> to start.</p>
            )}
            {transcriptions.map(t => (
              <div key={t.id} style={{ position: "relative", display: "flex", alignItems: "center", margin: "2px 8px", borderRadius: 8, background: t.id === activeId ? "#e8eefb" : "transparent", transition: "background 0.12s" }}
                onMouseLeave={() => {}}>
                <button onClick={() => onSelect(t.id)} style={{ flex: 1, padding: "10px 12px", border: "none", borderRadius: 8, textAlign: "left", cursor: "pointer", background: "transparent", fontFamily: "'IBM Plex Sans', sans-serif", minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: t.id === activeId ? 600 : 500, color: "#1a1a1a", marginBottom: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", paddingRight: 4 }}>{t.name || "Untitled"}</div>
                  <div style={{ fontSize: 11, color: "#888", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {t.status === "ready" || t.status === "analyzed" ? (t.transcript?.substring(0, 50) + "…") : t.status === "transcribing" ? "Transcribing…" : "New"}
                  </div>
                </button>
                <div style={{ position: "relative", flexShrink: 0 }} ref={menuOpenId === t.id ? menuRef : null}>
                  <button
                    onClick={e => { e.stopPropagation(); setMenuOpenId(menuOpenId === t.id ? null : t.id); }}
                    title="More options"
                    style={{ background: "none", border: "none", cursor: "pointer", color: "#aaa", fontSize: 16, padding: "6px 10px 6px 4px", lineHeight: 1, borderRadius: 6, transition: "color 0.12s" }}
                    onMouseEnter={e => e.currentTarget.style.color = "#555"}
                    onMouseLeave={e => e.currentTarget.style.color = "#aaa"}
                  >⋯</button>
                  {menuOpenId === t.id && (
                    <div style={{ position: "absolute", right: 0, top: "100%", background: "#fff", border: "1px solid #e2e2e2", borderRadius: 8, boxShadow: "0 4px 16px rgba(0,0,0,0.12)", zIndex: 100, minWidth: 120, padding: "4px 0" }}>
                      <button
                        onClick={e => { e.stopPropagation(); setConfirmId(t.id); setMenuOpenId(null); }}
                        style={{ display: "block", width: "100%", padding: "8px 14px", border: "none", background: "none", textAlign: "left", fontSize: 13, color: "#e03d3d", cursor: "pointer", fontFamily: "'IBM Plex Sans', sans-serif", fontWeight: 500 }}
                        onMouseEnter={e => e.currentTarget.style.background = "#fff5f5"}
                        onMouseLeave={e => e.currentTarget.style.background = "none"}
                      >Delete</button>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
          <div style={{ borderTop: "1px solid #ececec", padding: "10px 16px" }}>
            <button onClick={onSettings} style={{ background: "none", border: "none", color: "#888", fontSize: 12, cursor: "pointer", fontFamily: "'IBM Plex Mono', monospace" }}>⚙ Settings</button>
          </div>
          {confirmId && <DeleteConfirmModal name={confirmTarget?.name} onConfirm={handleDeleteConfirm} onCancel={() => setConfirmId(null)} />}
        </div>
      );
    }

    function SettingsView({ onClose }) {
      const [key, setKey] = useState(getApiKey());
      const [saved, setSaved] = useState(false);
      return (
        <div style={{ maxWidth: 520, margin: "0 auto", padding: "48px 32px", animation: "fadeIn 0.2s ease" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 32 }}>
            <h2 style={{ fontSize: 22, fontWeight: 600, color: "#1a1a1a" }}>Settings</h2>
            <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, color: "#999", cursor: "pointer" }}>×</button>
          </div>
          <label className="field-label">Anthropic API Key</label>
          <p style={{ fontSize: 12, color: "#888", marginBottom: 8, lineHeight: 1.5 }}>Required for analysis. Stored in your browser only.</p>
          <input type="password" value={key} onChange={e => { setKey(e.target.value); setSaved(false); }} placeholder="sk-ant-..." style={{ display: "block", width: "100%", padding: "10px 14px", marginBottom: 16, border: "1.5px solid #ddd", borderRadius: 8, fontSize: 14, outline: "none", fontFamily: "'IBM Plex Mono', monospace", boxSizing: "border-box" }} />
          <button onClick={() => { setApiKeyStore(key); setSaved(true); }} style={{ padding: "10px 24px", border: "none", borderRadius: 8, background: "#3b6fea", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Save</button>
          {saved && <span style={{ marginLeft: 12, fontSize: 13, color: "#2ecc71" }}>✓ Saved</span>}
        </div>
      );
    }

    function NewTranscriptionForm({ serverOnline, onTranscribe, onPasteManual }) {
      const [name, setName] = useState("");
      const [file, setFile] = useState(null);
      const [dragging, setDragging] = useState(false);
      const fileRef = useRef(null);
      const handleDrop = useCallback((e) => { e.preventDefault(); setDragging(false); const f = e.dataTransfer?.files?.[0]; if (f && /audio|video|\.m4a|\.mp3|\.wav|\.ogg|\.webm/i.test(f.type + f.name)) setFile(f); }, []);
      return (
        <div style={{ maxWidth: 520, margin: "0 auto", padding: "48px 32px", animation: "fadeIn 0.2s ease" }}>
          <h2 style={{ fontSize: 22, fontWeight: 600, color: "#1a1a1a", marginBottom: 32, letterSpacing: "-0.02em" }}>New Transcription</h2>
          <label className="field-label">Name <span style={{ color: "#aaa", fontWeight: 400, textTransform: "none" }}>(optional)</span></label>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Chat with committee" className="text-input" style={{ marginBottom: 24 }} />
          <label className="field-label">Provide Audio</label>
          <div onDragOver={e => { e.preventDefault(); setDragging(true); }} onDragLeave={() => setDragging(false)} onDrop={handleDrop} onClick={() => fileRef.current?.click()}
            style={{ marginTop: 6, marginBottom: 28, padding: file ? "14px 18px" : "36px 18px", border: `2px dashed ${dragging ? "#3b6fea" : file ? "#2ecc71" : "#d0d0d0"}`, borderRadius: 10, textAlign: "center", cursor: "pointer", background: dragging ? "#f0f4ff" : file ? "#f4fbf7" : "#fafafa", transition: "all 0.15s" }}>
            <input ref={fileRef} type="file" accept="audio/*,.m4a,.mp3,.wav,.ogg,.webm" onChange={e => setFile(e.target.files?.[0] || null)} style={{ display: "none" }} />
            {file ? (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 20 }}>🎧</span>
                <div style={{ textAlign: "left" }}><div style={{ fontSize: 13, fontWeight: 600, color: "#1a1a1a" }}>{file.name}</div><div style={{ fontSize: 11, color: "#888" }}>{(file.size / 1024 / 1024).toFixed(1)} MB</div></div>
                <button onClick={e => { e.stopPropagation(); setFile(null); }} style={{ marginLeft: "auto", background: "none", border: "none", color: "#999", cursor: "pointer", fontSize: 16 }}>×</button>
              </div>
            ) : (<><div style={{ fontSize: 28, marginBottom: 8, opacity: 0.4 }}>🎙</div><div style={{ fontSize: 13, color: "#888" }}>Drop an audio file here or <span style={{ color: "#3b6fea", fontWeight: 600 }}>browse</span></div><div style={{ fontSize: 11, color: "#bbb", marginTop: 4 }}>mp3, m4a, wav, ogg, webm</div></>)}
          </div>
          <button disabled={!file || !serverOnline} onClick={() => onTranscribe(name, file)} className="btn-primary"
            style={{ width: "100%", marginBottom: 16, background: file && serverOnline ? "#e8b931" : "#e8e8e8", color: file && serverOnline ? "#1a1a1a" : "#aaa", cursor: file && serverOnline ? "pointer" : "not-allowed" }}>
            {serverOnline ? "Transcribe" : "Server offline — can't transcribe"}
          </button>
          <div style={{ textAlign: "center" }}>
            <button onClick={onPasteManual} style={{ background: "none", border: "none", color: "#888", fontSize: 12, cursor: "pointer", textDecoration: "underline" }}>or paste transcript manually</button>
          </div>
        </div>
      );
    }

    function ManualPasteForm({ onSubmit }) {
      const [name, setName] = useState(""); const [text, setText] = useState("");
      return (
        <div style={{ maxWidth: 600, margin: "0 auto", padding: "48px 32px", animation: "fadeIn 0.2s ease" }}>
          <h2 style={{ fontSize: 22, fontWeight: 600, color: "#1a1a1a", marginBottom: 24 }}>Paste Transcript</h2>
          <label className="field-label">Name <span style={{ color: "#aaa", fontWeight: 400, textTransform: "none" }}>(optional)</span></label>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Braindump March 24" className="text-input" style={{ marginBottom: 20 }} />
          <label className="field-label">Transcript text</label>
          <textarea value={text} onChange={e => setText(e.target.value)} placeholder="Paste your transcript here…"
            style={{ display: "block", width: "100%", height: 220, padding: "12px 14px", marginTop: 6, marginBottom: 24, border: "1.5px solid #ddd", borderRadius: 8, fontSize: 14, outline: "none", fontFamily: "'IBM Plex Sans', sans-serif", resize: "vertical", lineHeight: 1.6, boxSizing: "border-box" }} />
          <button disabled={!text.trim()} onClick={() => onSubmit(name || "Pasted transcript", text)} className="btn-primary"
            style={{ width: "100%", background: text.trim() ? "#3b6fea" : "#e8e8e8", color: text.trim() ? "#fff" : "#aaa", cursor: text.trim() ? "pointer" : "not-allowed" }}>Save Transcript</button>
        </div>
      );
    }

    function TranscribingState({ name }) {
      const [dots, setDots] = useState("");
      useEffect(() => { const iv = setInterval(() => setDots(d => d.length >= 3 ? "" : d + "."), 500); return () => clearInterval(iv); }, []);
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flex: 1 }}>
          <div style={{ width: 56, height: 56, borderRadius: "50%", border: "3px solid #e8e8e8", borderTopColor: "#3b6fea", animation: "spin 0.8s linear infinite", marginBottom: 24 }} />
          <p style={{ fontSize: 16, fontWeight: 600, color: "#1a1a1a" }}>Transcribing{dots}</p>
          <p style={{ fontSize: 13, color: "#888", marginTop: 4 }}>{name || "Audio file"} is being processed by Whisper</p>
        </div>
      );
    }

    function TranscriptionView({ transcription, onAnalyze, analyzing }) {
      const [guideline, setGuideline] = useState("");
      const [copied, setCopied] = useState(false);
      const handleCopy = () => { navigator.clipboard.writeText(transcription.analysis); setCopied(true); setTimeout(() => setCopied(false), 2000); };
      return (
        <div style={{ padding: "32px 40px", maxWidth: 780, overflowY: "auto", animation: "fadeIn 0.2s ease" }}>
          <h2 style={{ fontSize: 22, fontWeight: 600, color: "#1a1a1a", letterSpacing: "-0.02em", marginBottom: 4 }}>{transcription.name || "Untitled"}</h2>
          <p style={{ fontSize: 11, color: "#aaa", marginBottom: 28, fontFamily: "'IBM Plex Mono', monospace" }}>
            {new Date(transcription.createdAt).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" })}
            {transcription.audioFile && <> · {transcription.audioFile}</>}
          </p>
          <div style={{ background: "#f8f8f6", borderRadius: 10, padding: "24px 28px", fontSize: 14, lineHeight: 1.7, color: "#2a2a2a", whiteSpace: "pre-wrap", maxHeight: 360, overflowY: "auto", marginBottom: 32, border: "1px solid #ececec" }}>
            {transcription.transcript}
          </div>
          <div style={{ borderTop: "1px solid #ececec", paddingTop: 24 }}>
            <h3 style={{ fontSize: 15, fontWeight: 600, color: "#1a1a1a", marginBottom: 16 }}>Analyze Transcription</h3>
            {!getApiKey() && <p style={{ fontSize: 12, color: "#c0392b", marginBottom: 12, fontFamily: "'IBM Plex Mono', monospace" }}>⚠ Set your Anthropic API key in Settings before analyzing.</p>}
            <div style={{ display: "flex", alignItems: "flex-end", gap: 12, marginBottom: 20 }}>
              <div style={{ flex: 1 }}>
                <label className="field-label" style={{ marginBottom: 4, display: "block" }}>Use Guideline</label>
                <select value={guideline} onChange={e => setGuideline(e.target.value)} className="select-input">
                  <option value="">Select Guideline</option>
                  {GUIDELINES.map(g => <option key={g.key} value={g.key}>{g.label}</option>)}
                </select>
              </div>
              <button disabled={!guideline || analyzing || !getApiKey()} onClick={() => onAnalyze(guideline)} className="btn-primary"
                style={{ padding: "10px 28px", whiteSpace: "nowrap", background: guideline && !analyzing && getApiKey() ? "#3b6fea" : "#e0e0e0", color: guideline && !analyzing && getApiKey() ? "#fff" : "#aaa", cursor: guideline && !analyzing && getApiKey() ? "pointer" : "not-allowed" }}>
                {analyzing ? "Analyzing…" : "Analyze"}
              </button>
            </div>
          </div>
          {transcription.analysis && (
            <div style={{ marginTop: 8, animation: "fadeIn 0.3s ease" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <h3 style={{ fontSize: 14, fontWeight: 600, color: "#3b6fea", margin: 0 }}>Analysis — {GUIDELINES.find(g => g.key === transcription.guideline)?.label}</h3>
                <button onClick={handleCopy} style={{ background: "none", border: "1px solid #ddd", borderRadius: 6, padding: "4px 12px", fontSize: 11, color: copied ? "#2ecc71" : "#666", cursor: "pointer", fontFamily: "'IBM Plex Mono', monospace", transition: "color 0.15s" }}>{copied ? "✓ Copied" : "Copy"}</button>
              </div>
              <div style={{ background: "#f0f4ff", borderRadius: 10, padding: "24px 28px", fontSize: 14, lineHeight: 1.7, color: "#1a1a3a", whiteSpace: "pre-wrap", border: "1px solid #d8e2f8", maxHeight: 500, overflowY: "auto" }}>
                {transcription.analysis}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // MAIN APP
    // ============================================================

    function App() {
      const [transcriptions, setTranscriptions] = useState(() => loadTranscriptions());
      const [activeId, setActiveId] = useState(null);
      const [view, setView] = useState("empty");
      const [serverOnline, setServerOnline] = useState(false);
      const [analyzing, setAnalyzing] = useState(false);
      const pollRef = useRef(null);

      useEffect(() => { saveTranscriptions(transcriptions); }, [transcriptions]);
      useEffect(() => { const check = () => checkServer().then(setServerOnline); check(); const iv = setInterval(check, 5000); return () => clearInterval(iv); }, []);

      const active = transcriptions.find(t => t.id === activeId);

      function updateTranscription(id, updates) {
        setTranscriptions(prev => prev.map(t => t.id === id ? { ...t, ...updates, updatedAt: Date.now() } : t));
      }

      function handleCreate() { setActiveId(null); setView("new"); }
      function handleSelect(id) { setActiveId(id); const t = transcriptions.find(x => x.id === id); setView(t?.status === "transcribing" ? "transcribing" : "detail"); }
      function handleDelete(id) {
        setTranscriptions(prev => prev.filter(t => t.id !== id));
        if (activeId === id) { setActiveId(null); setView("empty"); }
      }

      async function handleTranscribe(name, file) {
        const id = crypto.randomUUID();
        const finalName = name || file.name.replace(/\.[^.]+$/, "");
        setTranscriptions(prev => [{ id, name: finalName, audioFile: file.name, transcript: null, status: "transcribing", guideline: null, analysis: null, createdAt: Date.now(), updatedAt: Date.now() }, ...prev]);
        setActiveId(id); setView("transcribing");
        try {
          const formData = new FormData(); formData.append("audio", file); formData.append("name", finalName);
          const res = await fetch(`${SERVER_URL}/transcribe`, { method: "POST", body: formData });
          if (!res.ok) throw new Error("Server error");
          const data = await res.json();
          if (data.transcript) { updateTranscription(id, { transcript: data.transcript, status: "ready" }); setView("detail"); return; }
          const jobId = data.jobId || finalName;
          pollRef.current = setInterval(async () => {
            try {
              const pollRes = await fetch(`${SERVER_URL}/status/${encodeURIComponent(jobId)}`);
              const pollData = await pollRes.json();
              if (pollData.status === "done" && pollData.transcript) { clearInterval(pollRef.current); updateTranscription(id, { transcript: pollData.transcript, status: "ready" }); setView("detail"); }
            } catch {}
          }, 3000);
        } catch (err) { updateTranscription(id, { status: "ready", transcript: `[Error: ${err.message}. You can paste the transcript manually.]` }); setView("detail"); }
      }

      function handlePasteSubmit(name, text) {
        const id = crypto.randomUUID();
        setTranscriptions(prev => [{ id, name, audioFile: null, transcript: text, status: "ready", guideline: null, analysis: null, createdAt: Date.now(), updatedAt: Date.now() }, ...prev]);
        setActiveId(id); setView("detail");
      }

      async function handleAnalyze(guidelineKey) {
        if (!active) return;
        const apiKey = getApiKey();
        if (!apiKey) return;
        setAnalyzing(true);
        updateTranscription(active.id, { guideline: guidelineKey, status: "analyzing" });

        const guidelineText = GUIDELINE_TEXTS[guidelineKey] || "Process the transcript into well-organized notes.";

        try {
          const res = await fetch(`${SERVER_URL}/api/claude`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-api-key": apiKey },
            body: JSON.stringify({
              model: "claude-sonnet-4-20250514",
              max_tokens: 4096,
              system: guidelineText,
              messages: [{ role: "user", content: `Here is the transcript to process:\n\n${active.transcript}\n\nPlease process this transcript according to the guidelines provided. Create the output as instructed in the guide.` }],
            }),
          });

          const data = await res.json();
          if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));

          const analysisText = data.content
            ?.map(item => (item.type === "text" ? item.text : ""))
            .filter(Boolean)
            .join("\n") || "Analysis completed but no text response was returned.";

          updateTranscription(active.id, { analysis: analysisText, status: "analyzed", guideline: guidelineKey });
        } catch (err) {
          updateTranscription(active.id, { analysis: `Error during analysis: ${err.message}`, status: "ready" });
        }
        setAnalyzing(false);
      }

      useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

      return (
        <div style={{ display: "flex", height: "100vh", width: "100%", background: "#fff" }}>
          <Sidebar transcriptions={transcriptions} activeId={activeId} onSelect={handleSelect} onCreate={handleCreate} serverOnline={serverOnline} onSettings={() => { setActiveId(null); setView("settings"); }} onDelete={handleDelete} />
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflowY: "auto" }}>
            {view === "empty" && <div style={{ display: "flex", alignItems: "center", justifyContent: "center", flex: 1, color: "#ccc", fontSize: 14 }}>Select a transcription or create a new one</div>}
            {view === "settings" && <SettingsView onClose={() => setView("empty")} />}
            {view === "new" && <NewTranscriptionForm serverOnline={serverOnline} onTranscribe={handleTranscribe} onPasteManual={() => setView("paste")} />}
            {view === "paste" && <ManualPasteForm onSubmit={handlePasteSubmit} />}
            {view === "transcribing" && <TranscribingState name={active?.name} />}
            {view === "detail" && active && <TranscriptionView transcription={active} onAnalyze={handleAnalyze} analyzing={analyzing} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
